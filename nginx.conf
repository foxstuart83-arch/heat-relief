# ─── Structured JSON access log — captured by Cloud Logging as the audit trail ─
# Fields: timestamp, method, uri, status, client IP (from IAP/LB header),
#         authenticated user (set by Cloud IAP), bytes, latency.
log_format json_audit escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"ip":"$http_x_forwarded_for",'
    '"user_agent":"$http_user_agent",'
    '"iap_user":"$http_x_goog_authenticated_user_email",'
    '"iap_id":"$http_x_goog_iap_jwt_assertion"'
  '}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Emit structured JSON to stdout so Cloud Run / Cloud Logging captures every request
    access_log /dev/stdout json_audit;
    error_log  /dev/stderr warn;

    # ─── Access Control ──────────────────────────────────────────────────────
    # Cloud IAP sits in front of this service and injects the header below.
    # If the header is absent the request did not pass through IAP — reject it.
    # Set HEAT_RELIEF_PUBLIC=true in Cloud Run env vars to bypass (e.g. dev).
    set $require_iap "${HEAT_RELIEF_REQUIRE_IAP}";
    if ($require_iap = "true") {
        # x-goog-authenticated-user-email is only present when IAP validated the user
        set $iap_user "$http_x_goog_authenticated_user_email";
        if ($iap_user = "") {
            return 401 '{"error":"Authentication required"}';
        }
    }

    # ─── Static game files ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;

        # Cache static assets for one hour
        add_header Cache-Control        "public, max-age=3600";

        # Security headers
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header X-Frame-Options         "SAMEORIGIN"                     always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=()"   always;
        add_header Content-Security-Policy
          "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none';"
          always;
    }

    # Deny access to dot-files
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/html text/plain application/json;
}
